spec:
  name: recipe-website
  services:
  - name: web
    git:
      branch: main
      repo_clone_url: ${_self.repository}
    envs:
    - key: NODE_ENV
      value: production
    - key: PORT
      value: "3000"
    - key: IS_DO_APP
      value: "true"
    build_command: npm ci && npm run build
    run_command: node server.js
    http_port: 3000
    instance_size_slug: basic-xxs
    instance_count: 1
    source_dir: /
    routes:
    - path: /
    # Explicitly disable static site detection
    static_sites: []