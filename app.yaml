name: fairy-bites-static
static_sites:
- name: web
  environment_slug: html
  github:
    branch: main
    deploy_on_push: true
    repo: <username>/recipe-website
  build_command: npm ci && npm run build
  output_dir: out
  error_document: 404.html
  index_document: index.html
  catchall_document: 404.html