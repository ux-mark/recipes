name: Deploy to GitHub Pages

on:
  push:
    branches:
      - working # Changed to match the branch in the failing workflow
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18" # Using Node 18 as in your existing workflow
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build and fix paths for GitHub Pages
        run: npm run deploy-gh-pages
        env:
          NODE_ENV: "production"
          NODE_OPTIONS: "--experimental-json-modules"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4