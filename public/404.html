<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    // Single Page Apps for GitHub Pages and custom domains
    // This script takes the current URL and converts the path
    // for proper handling by the Next.js app
    (function() {
      // Store the full path including query string and hash
      const path = window.location.pathname + 
                (window.location.search || '') + 
                (window.location.hash || '');
      
      // Get hostname to detect environment
      const hostname = window.location.hostname;
      const isGitHubPages = hostname.includes('github.io') || hostname.includes('.githubusercontent.com');
      
      // Store the path for the homepage to handle
      if (path && path !== '/') {
        sessionStorage.setItem('redirectPath', path);
      }
      
      // Determine the correct redirect URL based on environment
      let redirectUrl = '/';
      if (isGitHubPages) {
        // For GitHub Pages, we need to include the repository name
        redirectUrl = '/recipes/';
      }
      
      // Add some debug info to console (only visible if user has dev tools open)
      console.log('[404 Redirect] Path:', path);
      console.log('[404 Redirect] Is GitHub Pages:', isGitHubPages);
      console.log('[404 Redirect] Redirecting to:', redirectUrl);
      
      // Redirect to the appropriate homepage
      window.location.replace(redirectUrl);
    })();
  </script>
</head>
<body>
  <p>Page not found. Redirecting to home page...</p>
</body>
</html>
