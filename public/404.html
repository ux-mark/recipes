<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    // SPA redirect script for GitHub Pages
    (function() {
      // Get the repo name from the pathname
      const pathSegments = window.location.pathname.split('/');
      const repoName = pathSegments[1]; // Should be 'recipe-website'
      const path = window.location.pathname;
      
      // Only redirect if this is the GitHub Pages site
      if (repoName === 'recipe-website') {
        // Store the path in sessionStorage
        sessionStorage.setItem('redirectPath', path);
        
        // Redirect to the base URL
        window.location.replace('/' + repoName + '/');
      }
    })();
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
