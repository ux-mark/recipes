<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fairy Bites</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            margin-bottom: 20px;
            color: #e63946;
        }
        .loading {
            display: inline-block;
            width: 50px;
            height: 50px;
            border: 3px solid rgba(230, 57, 70, 0.3);
            border-radius: 50%;
            border-top-color: #e63946;
            animation: spin 1s ease-in-out infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
    <script>
        // This script handles client-side navigation
        document.addEventListener('DOMContentLoaded', function() {
            // Short delay to ensure proper redirection
            setTimeout(function() {
                // If we're at the root, let Next.js handle the rendering
                if (window.location.pathname === '/' || 
                    window.location.pathname === '/index.html') {
                    return;
                }
                
                // Otherwise, we're likely in a client-side navigation scenario
                // on DigitalOcean where the static files aren't found
                // So redirect to the root where Next.js can handle the routing
                window.location.href = '/';
            }, 50);
        });
    </script>
</head>
<body>
    <div class="container">
        <h1>Fairy Bites</h1>
        <div class="loading"></div>
        <p>Loading your recipes...</p>
        <noscript>
            <p>This application requires JavaScript to be enabled.</p>
        </noscript>
    </div>
</body>
</html>
